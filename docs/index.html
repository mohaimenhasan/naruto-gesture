<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Naruto Gesture</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍥</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Loading / permission screen -->
  <div id="loading-screen">
    <div class="loader-content">
      <h1>🍥 Naruto Gesture</h1>
      <p id="loading-status">Loading scripts…</p>
      <div class="spinner"></div>
      <button id="start-btn" style="display:none">Start Camera</button>
    </div>
  </div>

  <!-- Main app -->
  <video id="webcam" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <!-- HUD overlay -->
  <div id="hud"></div>

  <!-- Instructions toast -->
  <div id="instructions">
    <p><strong>👋 Open palm</strong> → Rasengan</p>
    <p><strong>😑 Close eyes 1s+</strong> → Toggle Sharingan</p>
    <p><strong>ESC</strong> → Quit</p>
  </div>

  <!-- TensorFlow.js — pinned versions for compatibility -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.22.0/dist/tf-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.22.0/dist/tf-converter.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.22.0/dist/tf-backend-wasm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection/dist/hand-pose-detection.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection/dist/face-landmarks-detection.js"></script>

  <script type="module" src="js/app.js"></script>
</body>
</html>
